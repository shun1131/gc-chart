name: daily-update

on:
  schedule:
    - cron: "30 0 * * *"   # 毎日 09:30 JST(Binanceの日足確定 09:00 JST の後)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data
        run: python src/build_data.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  # 公開リポジトリは60日間コミットがないと定期実行が止まるため、
  # 最後のコミットから45日たったら空コミットを積んで止まらないようにする
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Empty commit if idle for 45 days
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "days since last commit: $days"
          if [ "$days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: 定期実行の自動停止を防ぐ空コミット"
            git push
          fi
