<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>GCチャート</title>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.54.1/dist/apexcharts.min.js"></script>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8b949e;
    --c-btc-rate: #2E93fA; --c-usd-rate: #F4B400; --c-btcusd: #E46A7E; --c-ethusd: #6AA84F;
    --c-rut: #22D3EE; --c-sp600: #A78BFA; --c-fng: #F97316;
    --c-sig-up: #3FB950; --c-sig-down: #FF5C5C;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px 20px 4px; }
  h1 { font-size: 22px; margin: 0 auto 0 0; letter-spacing: .04em; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  select, input[type=date], button {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font-size: 14px; color-scheme: dark;
  }
  button { cursor: pointer; } button:hover { border-color: var(--muted); }
  .toggle { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; color: var(--text); }
  .sig-up { color: var(--c-sig-up); } .sig-down { color: var(--c-sig-down); }
  #chart { padding: 0 8px; }
  footer { padding: 4px 20px 16px; font-size: 12px; color: var(--muted); line-height: 1.7; }
  #status { color: var(--muted); }
  @media (max-width: 640px) { header { padding: 12px 16px 0; } footer { padding: 4px 16px 16px; } }
</style>
</head>
<body>
<header>
  <h1>GC チャート</h1>
  <div class="controls">
    <select id="pair" aria-label="移動平均の期間"></select>
    <select id="span" aria-label="表示日数">
      <option value="100">100日</option>
      <option value="250">250日</option>
      <option value="500" selected>500日</option>
      <option value="1000">1000日</option>
      <option value="all">全期間</option>
    </select>
    <span>期間: From</span><input type="date" id="from">
    <span>To</span><input type="date" id="to">
    <button id="apply">更新</button>
    <label class="toggle"><input type="checkbox" id="showSignals" checked> シグナル</label>
  </div>
</header>
<div id="chart"></div>
<footer>
  <div id="status">読み込み中…</div>
  <div>rate USD = 対象銘柄のうちドル建てで「短期SMA &gt; 長期SMA」の割合 / rate BTC = 同じ判定をBTC建て価格で行った割合。
    対象 = Binance現物USDTペアの出来高上位(ステーブル等除く)。凡例クリックで系列の表示を切り替え。</div>
  <div><span class="sig-up">▲ 底反転</span> = 直近15日に rate USD が 0.1 を割ったあと 0.2 を上抜けた日 /
    <span class="sig-down">▼ 天井崩れ</span> = 直近15日に 0.9 を超えたあと 0.8 を下抜けた日(選択中の短期・長期の組み合わせで判定)</div>
</footer>
<script>
(async () => {
  const css = getComputedStyle(document.documentElement);
  const c = n => css.getPropertyValue(n).trim();
  const $ = id => document.getElementById(id);

  let data;
  try {
    const res = await fetch('data.json', { cache: 'no-cache' });
    data = await res.json();
  } catch (e) {
    $('status').textContent = 'データの読み込みに失敗しました: ' + e;
    return;
  }

  for (const key of Object.keys(data.rates)) {
    const [s, l] = key.split('-');
    $('pair').add(new Option(`短期${s}日 長期${l}日`, key));
  }
  $('pair').value = '7-25';

  const ts = data.dates.map(d => Date.parse(d + 'T00:00:00Z'));
  const fmt = n => n >= 1000 ? Math.round(n).toLocaleString() : n;

  // 表示する系列の定義。hidden=true は初期状態で非表示(凡例クリックで表示)
  const SERIES = [
    { name: 'rate BTC', color: c('--c-btc-rate'), get: k => data.rates[k].btc, axis: 'rate' },
    { name: 'rate USD', color: c('--c-usd-rate'), get: k => data.rates[k].usd, axis: 'rate' },
    { name: 'BTCUSD',   color: c('--c-btcusd'),   get: () => data.btcusd },
    { name: 'ETHUSD',   color: c('--c-ethusd'),   get: () => data.ethusd },
    { name: 'RUT2000',  color: c('--c-rut'),      get: () => data.rut2000, hidden: true },
    { name: 'SP600',    color: c('--c-sp600'),    get: () => data.sp600,   hidden: true },
    { name: '恐怖指数', color: c('--c-fng'),      get: () => data.fng,     axis: 'rate', hidden: true },
  ];

  const yaxis = SERIES.map((s, i) => {
    if (s.axis === 'rate') {
      return {
        seriesName: 'rate BTC', show: i === 0, min: 0, max: 1, tickAmount: 10,
        title: { text: 'GC 比率 / 恐怖指数', style: { color: c('--muted') } },
        labels: { formatter: v => v == null ? '' : v.toFixed(3), style: { colors: c('--muted') } },
      };
    }
    return {
      seriesName: s.name, opposite: true, forceNiceScale: true,
      title: { text: s.name, style: { color: s.color } },
      labels: { formatter: v => v == null ? '' : fmt(v), style: { colors: s.color } },
    };
  });

  function window_(from, to) {
    let i0 = 0, i1 = ts.length - 1;
    if (from) i0 = Math.max(0, ts.findIndex(t => t >= from));
    if (to) { const j = ts.findLastIndex(t => t <= to); if (j >= 0) i1 = j; }
    return [i0, i1];
  }

  function buildSeries(key, i0, i1) {
    return SERIES.map(s => ({
      name: s.name,
      data: s.get(key).slice(i0, i1 + 1).map((v, k) => [ts[i0 + k], v]),
    }));
  }

  // 反転シグナルの判定条件(rate USD に対して適用)
  const SIGNAL = { lookback: 15, low: 0.1, upTrigger: 0.2, high: 0.9, downTrigger: 0.8 };

  function detectSignals(u) {
    const out = [];
    for (let i = 1; i < u.length; i++) {
      if (u[i] == null || u[i - 1] == null) continue;
      const recent = u.slice(Math.max(0, i - SIGNAL.lookback), i).filter(v => v != null);
      if (!recent.length) continue;
      if (u[i - 1] < SIGNAL.upTrigger && u[i] >= SIGNAL.upTrigger && Math.min(...recent) < SIGNAL.low) {
        out.push({ i, dir: 'up' });
      } else if (u[i - 1] > SIGNAL.downTrigger && u[i] <= SIGNAL.downTrigger && Math.max(...recent) > SIGNAL.high) {
        out.push({ i, dir: 'down' });
      }
    }
    return out;
  }

  const BANDS = [
    { y: 0.9, y2: 1.0, yAxisIndex: 0, fillColor: '#E46A7E', opacity: 0.08, borderColor: 'transparent' },
    { y: 0.0, y2: 0.1, yAxisIndex: 0, fillColor: '#E46A7E', opacity: 0.08, borderColor: 'transparent' },
  ];

  function buildAnnotations(key, i0, i1) {
    const points = !$('showSignals').checked ? [] :
      detectSignals(data.rates[key].usd)
        .filter(s => s.i >= i0 && s.i <= i1)
        .map(({ i, dir }) => {
          const up = dir === 'up';
          const color = c(up ? '--c-sig-up' : '--c-sig-down');
          return {
            x: ts[i], y: data.rates[key].usd[i], yAxisIndex: 0,
            marker: { size: 5, fillColor: color, strokeColor: '#ffffff', strokeWidth: 1 },
            label: {
              text: up ? '▲' : '▼', borderWidth: 0, offsetY: up ? 38 : 0,
              style: { background: 'transparent', color, fontSize: '16px', padding: { left: 0, right: 0, top: 0, bottom: 0 } },
            },
          };
        });
    return { yaxis: BANDS, points };
  }

  function currentRange() {
    const from = $('from').value ? Date.parse($('from').value + 'T00:00:00Z') : null;
    const to = $('to').value ? Date.parse($('to').value + 'T00:00:00Z') : null;
    if (from || to) return window_(from, to);
    const span = $('span').value;
    const last = ts.length - 1;
    return span === 'all' ? [0, last] : [Math.max(0, last - Number(span) + 1), last];
  }

  const [i0, i1] = currentRange();
  const chart = new ApexCharts($('chart'), {
    chart: {
      type: 'line', height: Math.max(420, window.innerHeight - 140), background: 'transparent',
      foreColor: c('--muted'), animations: { enabled: false },
      zoom: { enabled: true, type: 'x' },
      toolbar: { tools: { download: true, selection: false, zoom: true, zoomin: true, zoomout: true, pan: true, reset: true } },
    },
    theme: { mode: 'dark' },
    series: buildSeries('7-25', i0, i1),
    colors: SERIES.map(s => s.color),
    stroke: { width: SERIES.map(s => s.axis === 'rate' && s.name !== '恐怖指数' ? 2 : 1.5), curve: 'straight' },
    xaxis: {
      type: 'datetime',
      labels: { datetimeUTC: true, format: "'yy/MM/dd" },
      tooltip: { enabled: false },
    },
    yaxis,
    grid: { borderColor: '#2a2f36', xaxis: { lines: { show: false } } },
    annotations: buildAnnotations('7-25', i0, i1),
    legend: { position: 'bottom', horizontalAlign: 'center', labels: { colors: c('--text') } },
    tooltip: {
      shared: true, theme: 'dark', x: { format: 'yyyy/MM/dd' },
      y: { formatter: (v, { seriesIndex }) => v == null ? '-' :
           (SERIES[seriesIndex].axis === 'rate' ? v.toFixed(3) : fmt(v)) },
    },
    dataLabels: { enabled: false },
    markers: { size: 0 },
  });
  await chart.render();
  SERIES.forEach(s => s.hidden && chart.hideSeries(s.name));

  function refresh() {
    const [a, b] = currentRange();
    const hidden = SERIES.filter(s => chart.w.globals.collapsedSeriesIndices
      .includes(SERIES.indexOf(s))).map(s => s.name);
    const key = $('pair').value;
    chart.updateOptions({ series: buildSeries(key, a, b), annotations: buildAnnotations(key, a, b) }, false, false);
    hidden.forEach(n => chart.hideSeries(n));
  }
  $('showSignals').addEventListener('change', refresh);
  $('apply').addEventListener('click', refresh);
  $('pair').addEventListener('change', refresh);
  $('span').addEventListener('change', () => { $('from').value = ''; $('to').value = ''; refresh(); });

  $('status').textContent =
    `最終更新: ${data.updated} / データ: ${data.dates[0]} 〜 ${data.dates.at(-1)} / 対象 ${data.universe.length} 銘柄`;
})();
</script>
</body>
</html>
